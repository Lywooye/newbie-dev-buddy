<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小白开发搭子 · 书签演示</title>
<style>
:root{color-scheme:light;--ink:#263b39;--muted:#64736f;--green:#2c7061;--cream:#f6f3e9;--line:#dbdfd3}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{max-width:1280px;margin:auto;padding:22px 36px}header{display:flex;align-items:center;justify-content:space-between;height:44px;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:23px}.buddy{display:grid;place-items:center;width:40px;height:40px;background:#ffd699;border:2px solid var(--ink);border-radius:14px;font:700 22px monospace;transform:rotate(-6deg)}.label{font-size:13px;color:var(--muted);padding:8px 12px;border:1px solid var(--line);border-radius:99px}
h1{font-size:35px;line-height:1.3;letter-spacing:-1px;margin:20px 0 8px}#lead{font-size:18px;color:var(--muted);margin:0 0 23px;line-height:1.6}.stage{display:grid;grid-template-columns:370px 1fr;gap:23px;min-height:386px}.chat,.record{background:#fffef9;border:1px solid var(--line);border-radius:20px;padding:23px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--green);margin-bottom:16px}.speaker{font-size:13px;font-weight:700;margin-bottom:9px}.bubble{font-size:20px;line-height:1.65;background:#edf3e9;padding:18px;border-radius:14px;margin-bottom:19px}.answer{font-size:17px;line-height:1.7;margin:0}#review{font-size:14px;line-height:1.7;color:var(--muted);border-top:1px dashed var(--line);padding-top:13px;margin-top:18px}.record-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.record-head h2{font-size:20px;margin:0}.path{font-size:12px;color:var(--muted);max-width:410px;overflow-wrap:anywhere;font-family:monospace}.record pre{font-size:16px;line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-height:250px;overflow:auto;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.module{padding:10px 0;border-bottom:1px solid var(--line)}.module:first-child{padding-top:0}.module:last-child{border:0}.module b{font-size:18px}.module p{font-size:15px;line-height:1.4;margin:4px 0}.module small{color:var(--muted);font-size:12px}.note{font-size:14px;background:#fff0db;border-radius:10px;padding:10px 14px;margin-top:17px;line-height:1.6}.state{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.state span{padding:13px;background:#edf3e9;border-radius:11px;font-size:17px}.state small{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:21px}.caption{font-size:15px;color:var(--green);max-width:760px;line-height:1.6}.controls{display:flex;align-items:center;gap:7px}button{font:inherit;color:var(--ink);background:#fffef9;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{background:#e6eedf}button:focus-visible{outline:3px solid var(--green);outline-offset:2px}.count{font-size:13px;color:var(--muted);min-width:36px;text-align:center}.progress{display:flex;gap:7px;margin-top:15px}.progress span{height:4px;background:#dce1d2;border-radius:10px;flex:1}.progress .active{background:var(--green)}
@media(max-width:800px){.shell{padding:20px}.stage{grid-template-columns:1fr}.label{display:none}h1{font-size:29px}.record pre{max-height:none}footer{align-items:flex-start;flex-direction:column}.chat,.record{padding:20px}}
</style>
<div class="shell">
  <header><div class="brand"><span class="buddy" aria-hidden="true">:)</span>小白开发搭子 <small style="font-size:13px;font-weight:400">Newbie Dev Buddy</small></div><span class="label">演示播放器 · 非工具自带界面</span></header>
  <main aria-live="polite"><h1 id="title"></h1><p id="lead"></p><div class="stage">
    <section class="chat"><div class="eyebrow">预设情境 · 看用户怎样选择</div><div class="speaker">你</div><div class="bubble" id="prompt"></div><div class="speaker">搭子工作流示意</div><p class="answer" id="answer"></p><div id="review"></div></section>
    <section class="record"><div class="record-head"><h2 id="recordTitle"></h2><span class="path" id="path"></span></div><div id="content"></div><div class="note" id="note"></div></section>
  </div></main>
  <footer><div class="caption" id="caption"></div><div class="controls"><button id="prev" aria-label="上一幕">←</button><button id="play">播放</button><button id="next" aria-label="下一幕">→</button><span class="count" id="count"></span></div></footer><div class="progress" id="progress" aria-hidden="true"></div>
</div>
<script src="demo-data.js"></script>
<script>
const scenes=window.BUDDY_DEMO.scenes;let index=0,timer=null;
function showScene(number){index=(number+scenes.length)%scenes.length;const scene=scenes[index];
  for(const key of ['title','lead','prompt','answer','review','recordTitle','path','note','caption'])document.getElementById(key).textContent=scene[key]||'';
  const area=document.getElementById('content');area.replaceChildren();
  if(scene.modules)for(const module of scene.modules){const row=document.createElement('div');row.className='module';const name=document.createElement('b');name.textContent=module.name;const text=document.createElement('p');text.textContent=module.purpose;const small=document.createElement('small');small.textContent=module.paths.join(' · ');row.append(name,text,small);area.append(row)}
  else if(scene.states){const grid=document.createElement('div');grid.className='state';for(const [label,value]of scene.states){const box=document.createElement('span');const small=document.createElement('small');small.textContent=label;box.append(small,document.createTextNode(value));grid.append(box)}area.append(grid);const p=document.createElement('pre');p.textContent=scene.text;area.append(p)}
  else{const pre=document.createElement('pre');pre.textContent=scene.text;area.append(pre)}
  document.getElementById('count').textContent=`${index+1}/${scenes.length}`;const progress=document.getElementById('progress');progress.replaceChildren();scenes.forEach((_,i)=>{const dot=document.createElement('span');if(i<=index)dot.className='active';progress.append(dot)});
}
function stop(){clearTimeout(timer);timer=null;document.getElementById('play').textContent='播放'}
function advance(){timer=setTimeout(()=>{if(index===scenes.length-1){stop();return}showScene(index+1);advance()},scenes[index].seconds*1000)}
document.getElementById('play').onclick=()=>{if(timer){stop();return}if(index===scenes.length-1)showScene(0);document.getElementById('play').textContent='暂停';advance()};
document.getElementById('prev').onclick=()=>{stop();showScene(index-1)};document.getElementById('next').onclick=()=>{stop();showScene(index+1)};
document.addEventListener('keydown',event=>{if(event.key==='ArrowRight')document.getElementById('next').click();if(event.key==='ArrowLeft')document.getElementById('prev').click()});
showScene(0);
</script>
</html>

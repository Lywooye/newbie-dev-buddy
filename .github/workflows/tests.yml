name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run synthetic behavior tests
        run: python -m unittest discover -s tests -v
      - name: Check public file manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          declared = Path("PUBLIC_FILES.txt").read_text().splitlines()
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")[:-1]
          assert len(declared) == len(set(declared)), "duplicate public file entry"
          assert sorted(declared) == sorted(tracked), "tracked files differ from PUBLIC_FILES.txt"
          PY

  installer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check host installer safety with synthetic fixtures
        run: python -m unittest discover -s tests -p "test_install.py" -v
      - name: Check dependency installer safety with synthetic bundles
        run: python -m unittest discover -s tests -p "test_codegraph_setup.py" -v
      - name: Preview selected host with platform wrapper
        shell: bash
        if: runner.os != 'Windows'
        run: sh install.sh --agent pi --dry-run
      - name: Preview selected host with PowerShell wrapper
        shell: pwsh
        if: runner.os == 'Windows'
        run: ./install.ps1 --agent pi --dry-run

  bundled-kit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check bundled runtime behavior and security regressions
        run: node --test vendor/acceptance-kit/test/cli.test.mjs vendor/acceptance-kit/test/security.test.mjs

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run synthetic behavior tests
        run: python -m unittest discover -s tests -v
      - name: Check public file manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          declared = Path("PUBLIC_FILES.txt").read_text().splitlines()
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")[:-1]
          assert len(declared) == len(set(declared)), "duplicate public file entry"
          assert sorted(declared) == sorted(tracked), "tracked files differ from PUBLIC_FILES.txt"
          PY
